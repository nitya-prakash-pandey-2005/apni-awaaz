[project]
name = "awaaz"
version = "0.1.0"
description = "Speak again in your own voice: voice banking and talk-assist in Indian languages. Built on Gnani AI voice cloning, Timbre and Prisma; Evon v3.3-ready through an OpenAI-compatible adapter (the demos run on Groq)."
requires-python = ">=3.12,<3.13"
dependencies = ["voice-core"]

[tool.uv.sources]
voice-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awaaz"]

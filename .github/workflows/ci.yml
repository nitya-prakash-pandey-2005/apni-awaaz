# Keyless CI: the backend tests run against fakes (no Gnani or LLM calls), and the web app is built
# in both modes (the normal app the backend serves, and the static demo that Vercel deploys).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.20"
          python-version: "3.12"
          enable-cache: true

      - name: Install the workspace (voice-core + backend) from uv.lock
        run: uv sync --all-packages --locked

      - name: Run the tests
        run: uv run python -m pytest -q

  frontend:
    name: Web build (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies from package-lock.json
        run: npm ci --no-audit --no-fund

      - name: Build the app
        run: npm run build

      - name: Build the static demo (what Vercel deploys)
        run: npm run build:demo
